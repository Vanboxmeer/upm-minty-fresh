<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Fullmedia Alchemist transmutation circle">
  <!-- outer double ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#1f6f52" stroke-width="0.9"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#1f6f52" stroke-width="2.4"/>

  <!-- star lattice: triangle + crossing diagonals to the two side points -->
  <g fill="none" stroke="#1f6f52" stroke-width="1.4" stroke-linejoin="round">
    <path d="M50 12 L82.9 69 L17.1 69 Z"/>
    <line x1="82.9" y1="69" x2="11.9" y2="28"/>
    <line x1="17.1" y1="69" x2="88.1" y2="28"/>
    <line x1="11.9" y1="28" x2="88.1" y2="28"/>
  </g>

  <!-- outward shield arcs along each triangle edge -->
  <g fill="none" stroke="#1f6f52" stroke-width="1.9" stroke-linecap="round">
    <path d="M50 12 Q73.4 36.5 82.9 69"/>
    <path d="M82.9 69 Q50 77 17.1 69"/>
    <path d="M17.1 69 Q26.6 36.5 50 12"/>
  </g>

  <!-- inner circle -->
  <circle cx="50" cy="50" r="15" fill="none" stroke="#1f6f52" stroke-width="1.4"/>

  <!-- three main medallions (empty) -->
  <circle cx="50" cy="12" r="9" fill="none" stroke="#1f6f52" stroke-width="2"/>
  <circle cx="82.9" cy="69" r="9" fill="none" stroke="#1f6f52" stroke-width="2"/>
  <circle cx="17.1" cy="69" r="9" fill="none" stroke="#1f6f52" stroke-width="2"/>

  <!-- two side accent points -->
  <circle cx="11.9" cy="28" r="3.6" fill="none" stroke="#1f6f52" stroke-width="1.6"/>
  <circle cx="88.1" cy="28" r="3.6" fill="none" stroke="#1f6f52" stroke-width="1.6"/>
</svg>
